<h1>This is my Hello, my-app</h1>

<input 
  type="text" 
  [value]="infoAdd" 
  (input)="infoAdd = $any($event.target).value" 
/>
<button type="button" (click)="addInfo()">Add info</button>
<button type="button" (click)="updateInfo()">Update info</button>

@if (showInfodata && showInfodata.length > 0) {
  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Select</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for(item of showInfodata; track $index) {
        <tr>
          <td>{{ item.title }}</td>
          <td>
            <input type="checkbox" [checked]="item.checked" (change)="item.checked = $any($event.target).checked" />
          </td>
          <td>
            <button type="button" (click)="deleteInfo(item.id)">Delete</button>
            <button type="button" (click)="getInfo(item)">Get info for edit</button>
          </td>
        </tr>
      }
    </tbody>
  </table>
} @else {
  <p>Loading posts or no data available...</p>
}
