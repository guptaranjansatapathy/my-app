<h1>This is my Hello, my-app</h1>

<input 
  type="text" 
  [value]="infoAdd" 
  (input)="infoAdd = $any($event.target).value" 
/>
<button type="button" (click)="addInfo()">Add info</button>
<button type="button" (click)="updateInfo()">Update info</button>

@if (showInfodata.length === 0) {
  <p>Loading posts or no data available...</p>
} @else {
  <table>
    @for(item of showInfodata; track item.id){
      <tr>
        <td>{{item.title}}</td>
        <td><input type="checkbox" [(ngModel)]="item.checked" /></td>
        <td><button type="button" (click)="deleteInfo(item.id)">Delete</button></td>
        <td><button type="button" (click)="getInfo(item)">get info for edit</button></td>
      </tr>
    }
  </table>
}
